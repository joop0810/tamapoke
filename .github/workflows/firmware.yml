name: Firmware bauen

# Baut die Dennis-Build-Firmware in der Cloud: eperdemes TamaPoke 4.0 plus den
# neuesten Patch aus quellcode/, kompiliert fuer das Waveshare-Board und legt die
# vier Teile nach firmware/. Die Seite (GitHub Pages aus main) ist danach aktuell.
#
# Startet bei jeder Aenderung an quellcode/firmware-*.patch oder per Hand unter
# Actions -> "Firmware bauen" -> Run workflow.

on:
  push:
    branches: [main]
    paths: ['quellcode/firmware-*.patch', '.github/workflows/firmware.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firmware
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: site
      - uses: actions/checkout@v4
        with:
          repository: eperdeme/TamaPoke
          ref: 23ca2113270fda47abe6fcc806c4580aa2dd9854   # v4.0
          path: TamaPoke
      - uses: arduino/setup-arduino-cli@v2
      - uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-${{ runner.os }}-esp32-3.3.11-gfx-1.6.7-sensor-0.4.1-xpowers-0.3.3
      - name: ESP32-Core und Bibliotheken
        run: |
          URL=https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index --additional-urls $URL
          arduino-cli core install esp32:esp32@3.3.11 --additional-urls $URL
          arduino-cli lib install "GFX Library for Arduino@1.6.7" "SensorLib@0.4.1" "XPowersLib@0.3.3"
      - name: Patch anwenden
        run: |
          P=$(ls site/quellcode/firmware-*.patch | sort -V | tail -1)
          echo "Patch: $P"
          cd TamaPoke && git apply --whitespace=nowarn "../$P"
      - name: Kompilieren
        run: |
          set -o pipefail
          FQBN="esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB"
          if ! arduino-cli compile --fqbn "$FQBN" --export-binaries TamaPoke 2>&1 | tee build.log; then
            grep -E "error|Error" build.log | head -25 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
      - name: Firmware und Manifest aktualisieren
        run: |
          B=TamaPoke/build/esp32.esp32.esp32s3
          mkdir -p site/firmware
          cp "$B/TamaPoke.ino.bootloader.bin" site/firmware/bootloader.bin
          cp "$B/TamaPoke.ino.partitions.bin" site/firmware/partitions.bin
          cp "$B/boot_app0.bin"               site/firmware/boot_app0.bin
          cp "$B/TamaPoke.ino.bin"            site/firmware/app.bin
          FW=$(grep -o 'FW_VERSION "[0-9.]*"' TamaPoke/TamaPoke.ino | grep -o '[0-9.]*' | head -1)
          echo "Firmware $FW"
          python3 - "$FW" <<'PY'
          import hashlib, json, sys
          fw = sys.argv[1]
          m = json.load(open('site/manifest.json'))
          m['version'] = fw
          m['name'] = f'TamaPoke {fw} (Dennis)'
          # ?v=<hash>: Pages sits behind a CDN; without it a browser can pair a
          # new manifest with a cached app.bin and the board boot-loops.
          def part(p, off):
              h = hashlib.sha256(open('site/' + p, 'rb').read()).hexdigest()[:16]
              return {'path': f'{p}?v={h}', 'offset': off}
          m['builds'][0]['parts'] = [part('firmware/bootloader.bin', 0), part('firmware/partitions.bin', 0x8000),
                                     part('firmware/boot_app0.bin', 0xe000), part('firmware/app.bin', 0x10000)]
          json.dump(m, open('site/manifest.json', 'w'), indent=2)
          e = json.load(open('site/editions.json'))
          e['current']['name'] = f'Dennis-Build {fw}'
          json.dump(e, open('site/editions.json', 'w'), indent=2, ensure_ascii=False)
          PY
      - name: Einchecken
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware manifest.json editions.json
          if git diff --cached --quiet; then echo "nichts geaendert"; exit 0; fi
          git commit -m "Firmware gebaut aus $(ls quellcode/firmware-*.patch | sort -V | tail -1 | xargs basename)"
          git push
